[package]
name = "open-controller-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux desktop control MCP server for OpenCode"
repository = "https://github.com/amazing-things/open-controller"

[[bin]]
name = "open-controller-linux"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2.0", features = ["server", "server-side-http", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-worker"] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.11"
shlex = "1.3"
sysinfo = "0.39"
arboard = { version = "3.6", features = ["wayland-data-control"] }
notify-rust = "4.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json", "gzip"] }
url = "2.5"
scraper = "0.27"
walkdir = "2.5"
axum = "0.8"
tower = "0.5"

enigo = "0.6"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "resource_manager", "randr"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
zbus = "5.17"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
constant_time_eq = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"
